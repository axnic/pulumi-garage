# Dependabot — routine + security updates
#
# Every ecosystem below opens routine version-update PRs (weekly). What
# happens to a PR after that (approval, auto-merge) is decided by the
# central Dependency Updates workflow (axnic/.github), not here.
# No `commit-message:` prefix/scope config here on purpose - Dependabot's
# own subject text is never sentence-case and its scope for dev deps is
# "deps-dev" (not in .commitlintrc.js's scope-enum), so any merge
# automation must build a compliant `build(deps): Bump ...` subject itself
# instead of relying on Dependabot's title. Not grouping updates
# either, so each PR carries exactly one dependency and one semver level.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /examples
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
