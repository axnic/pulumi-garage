# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Dependency Updates — Dependabot and Renovate auto-merge
# =============================================================================
# Approves and auto-merges the pull requests of Dependabot (patch and security updates) and of
# Renovate (the updates its preset marks as safe: patches, minors from 1.0 on, security updates),
# with a merge-commit subject that follows the commit convention. Everything else stays open for
# review.
#
# Jobs:
#   deps — approve and merge Dependabot and Renovate updates, from core.deps
#
# MANAGED BY TERRAFORM (axnic/.github, terraform/modules/workflows) — do not edit by hand.
# Reusable workflow: https://github.com/axnic/.github/blob/main/.github/workflows/core.deps.yaml
# =============================================================================

name: Dependency Updates

on:
  pull_request:
    branches: [main]

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # deps — approve and merge Dependabot and Renovate updates, from core.deps
  # ---------------------------------------------------------------------------
  deps:
    name: 🤖 Dependency Auto-merge
    # Intentionally not pinned: follows the latest axnic/.github (owner-controlled repo).
    uses: axnic/.github/.github/workflows/core.deps.yaml@main
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      merge-method: "merge"
      subject-prefix: "build(deps)"
