# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# MANAGED BY TERRAFORM (axnic/.github-private, modules/workflows) — do not edit by hand.
# Reusable workflow: https://github.com/axnic/.github/blob/main/.github/workflows/core.deps.yaml

name: Dependency Updates

on:
  pull_request:
    branches: [main]

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  deps:
    name: 🤖 Dependabot Auto-merge
    # Intentionally not pinned: follows the latest axnic/.github (owner-controlled repo).
    uses: axnic/.github/.github/workflows/core.deps.yaml@main
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      merge-method: "squash"
      subject-prefix: "build(deps)"
