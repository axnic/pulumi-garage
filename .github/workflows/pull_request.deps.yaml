# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Dependency Updates — Dependabot auto-merge
# =============================================================================
# Approves and auto-merges Dependabot pull requests for patch updates and for security updates
# at any semver level (minor/major non-security updates stay open for review), with a merge-commit
# subject that follows the commit convention.
#
# Jobs:
#   deps — approve and merge Dependabot patch and security updates, from core.deps
#
# MANAGED BY TERRAFORM (axnic/.github-private, modules/workflows) — do not edit by hand.
# Reusable workflow: https://github.com/axnic/.github/blob/main/.github/workflows/core.deps.yaml
# =============================================================================

name: Dependency Updates

on:
  pull_request:
    branches: [main]

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # deps — approve and merge Dependabot patch and security updates, from core.deps
  # ---------------------------------------------------------------------------
  deps:
    name: 🤖 Dependabot Auto-merge
    # Intentionally not pinned: follows the latest axnic/.github (owner-controlled repo).
    uses: axnic/.github/.github/workflows/core.deps.yaml@main
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      merge-method: "squash"
      subject-prefix: "build(deps)"
