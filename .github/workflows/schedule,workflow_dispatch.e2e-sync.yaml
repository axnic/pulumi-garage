# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# MANAGED BY TERRAFORM (axnic/.github-private, modules/workflows) — do not edit by hand.
# Reusable workflow: https://github.com/axnic/.github/blob/main/.github/workflows/e2e.sync.yaml

name: E2E Sync

on:
  schedule:
    - cron: 0 3 * * 1
  workflow_dispatch: {}

concurrency:
  group: e2e-sync
  cancel-in-progress: false

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  sync:
    name: 🔄 Sync E2E callers
    # Intentionally not pinned: follows the latest axnic/.github (owner-controlled repo).
    uses: axnic/.github/.github/workflows/e2e.sync.yaml@main
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
