# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Dependency Audit — Audit the repository's dependencies
# =============================================================================
# Runs the repository's own dependency audit (mise run security:audit) daily
# and on demand.
# Requires the mise task: security:audit.
#
# Jobs:
#   audit — mise run security:audit, from security.audit
#
# MANAGED BY TERRAFORM (axnic/.github-private, modules/workflows) — do not edit by hand.
# Reusable workflow: https://github.com/axnic/.github/blob/main/.github/workflows/security.audit.yaml
# =============================================================================

name: Dependency Audit

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # audit — mise run security:audit, from security.audit
  # ---------------------------------------------------------------------------
  audit:
    name: 📦 Dependency Audit
    # Intentionally not pinned: follows the latest axnic/.github (owner-controlled repo).
    uses: axnic/.github/.github/workflows/security.audit.yaml@main
    secrets: inherit
    permissions:
      contents: read
