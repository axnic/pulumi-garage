# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# MANAGED BY TERRAFORM (axnic/.github-private, modules/workflows) — do not edit by hand.
# Reusable workflow: https://github.com/axnic/.github/blob/main/.github/workflows/core.review.yaml

name: AI Review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  review:
    name: 🤖 PR Agent
    # Intentionally not pinned: follows the latest axnic/.github (owner-controlled repo).
    uses: axnic/.github/.github/workflows/core.review.yaml@main
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: write
