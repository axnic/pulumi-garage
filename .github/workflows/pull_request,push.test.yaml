# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# MANAGED BY TERRAFORM (axnic/.github-private, modules/workflows) — do not edit by hand.
# Reusable workflow: https://github.com/axnic/.github/blob/main/.github/workflows/go.test.yaml

name: Quality Assurance

on:
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/pull_request,push.test.yaml
  push:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/pull_request,push.test.yaml

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  test:
    name: 🧪 Go
    # Intentionally not pinned: follows the latest axnic/.github (owner-controlled repo).
    uses: axnic/.github/.github/workflows/go.test.yaml@main
    secrets: inherit
    permissions:
      contents: read
