# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# E2E (v2.3.0) — end-to-end tests against Garage v2.3.0
# =============================================================================
# Runs the repository's E2E suite against Garage v2.3.0, on merge_group,
# pull_request and pushes to main. One caller file per version, so each version
# gets its own status badge.
# Requires the mise task: ci:e2e (reads E2E_VERSION).
#
# Generated by the e2e.sync workflow of axnic/.github — do not rename by hand.
# Reusable workflow: https://github.com/axnic/.github/blob/main/.github/workflows/e2e.run.yaml
# =============================================================================

name: E2E (v2.3.0)

on:
  merge_group: {}
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  e2e:
    name: 🧪 E2E (v2.3.0)
    # Intentionally not pinned: follows the latest axnic/.github (owner-controlled repo).
    uses: axnic/.github/.github/workflows/e2e.run.yaml@main
    with:
      version: v2.3.0
    secrets: inherit
    permissions:
      contents: read
