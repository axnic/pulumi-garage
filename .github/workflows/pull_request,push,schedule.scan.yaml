# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# MANAGED BY TERRAFORM (axnic/.github-private, modules/workflows) — do not edit by hand.
# Reusable workflow: https://github.com/axnic/.github/blob/main/.github/workflows/core.scan.yaml

name: Code Scanning

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: 0 6 * * *

concurrency:
  group: scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  scan:
    name: 🧬 CodeQL
    # Intentionally not pinned: follows the latest axnic/.github (owner-controlled repo).
    uses: axnic/.github/.github/workflows/core.scan.yaml@main
    secrets: inherit
    permissions:
      actions: read
      contents: read
      security-events: write
