# Development environment and shared tasks for pulumi-garage. CI never calls
# tools directly: it runs `mise run <task>` (see the Tasks section). The
# vfox-pulumi plugin below derives the Go and Pulumi versions from go.mod and
# .pulumi.version. Run `mise tasks` to list the tasks.

[env]
_.vfox-pulumi = { module_path = "." }   # Sets GO_VERSION_MISE and PULUMI_VERSION_MISE
PULUMI_HOME = "{{config_root}}/.pulumi"

[tools]

# Runtimes
#
# Only yaml/go example programs are exercised in CI (see README's "Known
# limitations"), but all 4 SDKs (nodejs, python, dotnet, go) are generated
# and published on release, so their toolchains are all needed here too -
# see the central Release workflow (axnic/.github). Java/Maven Central were dropped
# (see git history) - too little pulumi+java adoption to justify the setup
# cost (Sonatype namespace verification, GPG signing, etc).
go = "{{ env.GO_VERSION_MISE }}"
node = '24.18.0'
python = '3.11.8'
"vfox:version-fox/vfox-dotnet" = "8.0.20" # vfox backend doesn't work on Windows, gives "error converting Lua table to PreInstall (no version returned from vfox plugin)" https://github.com/jdx/mise/discussions/5876 https://github.com/jdx/mise/discussions/5550

# Executable tools
"github:pulumi/pulumi" = "{{ env.PULUMI_VERSION_MISE }}"
"github:pulumi/pulumictl" = '0.0.50'
"github:pulumi/schema-tools" = "0.6.0"
"go:github.com/pulumi/upgrade-provider" = "main"
"github:axnic/rtunk" = "latest"                          # Lint stack (golangci-lint, gofmt, yamllint, ...) driven by .rtunk/rtunk.yaml
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"        # Known-CVE scan of the provider's Go dependencies (`security:audit`)
"npm:@commitlint/cli" = "21.2.1"
"npm:yarn" = "1.22.22"

[settings]
experimental = true                 # Required for Go binaries (e.g. pulumictl).
lockfile = false
http_retries = 3
pin = true                          # `mise use` should pin versions instead of defaulting to latest.
fetch_remote_versions_cache = "24h" # Mise queries versions even if they're pinned to confirm they exist. Reduce GitHub API calls by doing that less often.
# python-build's 3.11.8 release has no GitHub artifact attestation data
# published for it (verified reproducible, not transient - mise's own error
# points at this exact fix), so mise's attestation check fails installing it
# outright otherwise: "No GitHub artifact attestations found for python@3.11.8".
python.github_attestations = false

[plugins]
vfox-pulumi = "https://github.com/pulumi/vfox-pulumi"

# =============================================================================
# Tasks
# =============================================================================
# CI never calls tools directly: it runs `mise run <task>`. Each task is also
# the exact command to run locally; `ci` chains them as the quality gate.

[tasks.lint]
description = "Lint the whole repository with rtunk"
run = "rtunk check ."

[tasks."lint:fix"]
description = "Lint the whole repository with rtunk and apply the fixes"
run = "rtunk check --fix ."

[tasks."ci:commitlint"]
description = "Validate commit messages in a range (usage: mise run ci:commitlint -- --from <sha> --to <sha> | --last)"
usage = 'arg "[args]..." var=#true'
run = '''
# commitlint reads stdin when given no range, which would hang: require one.
case " $usage_args " in
  *" --from "*|*" --to "*|*" --last "*|*" -f "*|*" -t "*|*" -l "*) ;;
  *) echo "usage: mise run ci:commitlint -- --from <sha> --to <sha> | --last" >&2; exit 2 ;;
esac
eval "set -- $usage_args"
commitlint --verbose "$@"
'''

[tasks."ci:build"]
description = "Build the provider binary"
run = "make provider"

[tasks."ci:test"]
description = "Run the provider unit tests (writes provider/coverage.txt)"
run = "make test"

# A floor, not a target: it catches coverage regressions without pinning
# today's exact number. Raise it as coverage improves; never lower it to make
# a failing PR pass. Reads provider/coverage.txt, so run ci:test first.
[tasks."ci:coverage"]
description = "Fail if total statement coverage is below the floor (default 60%)"
env = { COVERAGE_FLOOR = "60" }
run = '''
total=$(go tool cover -func=provider/coverage.txt | tail -1 | awk '{print $NF}' | tr -d '%')
echo "Total statement coverage: ${total}%"
awk -v total="$total" -v floor="$COVERAGE_FLOOR" 'BEGIN { if (total + 0 < floor + 0) { print "coverage " total "% is below the " floor "% floor"; exit 1 } }'
'''

# Go: govulncheck on the provider module. The nodejs SDK is generated and has a
# yarn.lock, so it is audited too (production deps only); python and dotnet
# SDKs have no lockfile and are not audited.
[tasks."security:audit"]
description = "Audit the dependencies (Go module and nodejs SDK) for known vulnerabilities"
run = '''
set -e
govulncheck ./...
cd sdk/nodejs && yarn audit --groups dependencies
'''

# E2E_VERSION is the Garage image tag (e.g. v2.3.0); needs docker.
[tasks."ci:e2e"]
description = "Run the E2E suite against a dockerized Garage (usage: E2E_VERSION=v2.3.0 mise run ci:e2e)"
run = '''
: "${E2E_VERSION:?E2E_VERSION is required (e.g. v2.3.0)}"
export GARAGE_VERSION="$E2E_VERSION"
make test_e2e
'''

[tasks."ci:e2e:versions"]
description = "Print one Garage version per distinct stable v2 minor, as vMAJOR.MINOR.0 (one per line)"
run = '''
set -euo pipefail
curl -sfL "https://git.deuxfleurs.fr/api/v1/repos/Deuxfleurs/garage/releases" \
  | jq -r '.[] | select(.prerelease == false) | .tag_name' \
  | grep -E '^v2\.[0-9]+\.[0-9]+$' \
  | sed -E 's/^(v2\.[0-9]+)\..*/\1.0/' | sort -uV
'''

[tasks.ci]
description = "Local CI quality gate: lint, build, tests, coverage (commit messages, E2E and security:audit excluded)"
# depends runs lint, build and test; `run` then checks coverage, which needs the test output.
depends = ["lint", "ci:build", "ci:test"]
run = "mise run ci:coverage"
