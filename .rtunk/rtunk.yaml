# Configuration of rtunk for this repository: the linters, runtimes and plugin sources that
# `rtunk check` and `rtunk fmt` use here. rtunk reads the trunk.yaml format. golangci-lint reads
# its own configuration from .golangci.yml.
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - go@1.25.11
    - node@22.16.0
    - python@3.14.4
lint:
  enabled:
    - gofmt@1.20.4
    - golangci-lint2@2.12.2
    - osv-scanner@2.5.1
    - taplo@0.10.0
    - markdownlint@0.49.1
    - prettier@3.9.6
    - trufflehog@3.97.4
    - yamllint@1.38.0
actions:
  disabled:
    - trunk-announce
  enabled:
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
